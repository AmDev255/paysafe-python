[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paysafe-tz"
version = "0.1.0"
description = "Official Python SDK for the PaySafe payments API (Tanzania mobile money, refunds, control numbers, payment links, transfers, webhooks)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "PaySafe" }]
requires-python = ">=3.9"
keywords = ["paysafe", "payments", "tanzania", "mobile-money", "mpesa", "tigopesa", "airtel-money", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1", "typing-extensions>=4.5; python_version < '3.11'"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://paysafe.co.tz/docs"
Documentation = "https://paysafe.co.tz/docs"
Repository = "https://github.com/AmDev255/paysafe-python"
Issues = "https://github.com/AmDev255/paysafe-python/issues"
Changelog = "https://github.com/AmDev255/paysafe-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/paysafe_tz"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "N", "RUF"]
ignore = ["S101", "S311", "RUF012", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"examples/**" = ["S105", "S106", "T201"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:paysafe_tz.*"]
