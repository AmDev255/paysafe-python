name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build package artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build package
        run: |
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*

  # Publishing is intentionally disabled. Enable the job and add the registry credentials as
  # repository secrets only after PaySafe approves the release.
  publish:
    name: Publish (disabled)
    needs: build
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
      - name: Publish
        run: echo "twine upload dist/*"
